services:
  db:
    image: postgres:16
    container_name: telemetry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user1 -d telemetry" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
